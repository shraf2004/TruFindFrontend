<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Welcome back | TruFind</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="auth-page">
    <main class="auth-layout ">
        <aside class="auth-photo">
            <div class="auth-photo-copy">
                <p class="eyebrow">Truman State University</p>
                <p class="photo-heading">Find your way<br> back to it.</p>
                <p>A campus lost-and-found for the Truman community.</p>
            </div>
        </aside>
        <section class="auth-panel" aria-labelledby="page-title">
            <div class="auth-content">
                <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true"></span>TruFind</a>
                <h1 id="page-title">Welcome back</h1>
                <p class="intro">Sign in with your Truman email to open the campus noticeboard.</p>
                <p id="authFeedback" class="feedback" role="status" aria-live="polite" aria-atomic="true"></p>
                <form id="loginForm" class="auth-form" aria-describedby="authFeedback">
                    <label for="loginEmail">Truman email</label>
                    <input id="loginEmail" type="email" placeholder="you@truman.edu" autocomplete="username" required>
                    <label for="loginPassword">Password</label>
                    <div class="password-field">
                        <input id="loginPassword" type="password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle" aria-controls="loginPassword">Show<span class="sr-only"> password</span></button>
                    </div>
                    <button class="button primary full" type="submit">Sign in</button>
                </form>
                <p class="auth-footer">New to TruFind? <a href="RegForm.html">Create an account</a>.</p>
            </div>
        </section>
    </main>
</body>
</html>
